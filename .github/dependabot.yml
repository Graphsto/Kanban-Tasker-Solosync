version: 2

# Monthly version updates only. Keep automatic security-update PRs disabled
# in repository settings: their timing is independent of this schedule.
updates:
  - package-ecosystem: nuget
    # The root solution references every application and test project.
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      nuget-monthly:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      actions-monthly:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
